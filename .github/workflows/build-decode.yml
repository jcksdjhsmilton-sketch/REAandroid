          package app.rea.android

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.os.Build
          import android.os.IBinder
          import android.os.PowerManager
          import fi.iki.elonen.NanoHTTPD

          class McpService : Service() {
              private var server: McpHttpServer? = null
              private var tunnel: Tunnel? = null
              private var wl: PowerManager.WakeLock? = null

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (intent?.action == "stop") {
                      shutdown()
                      stopSelf()
                      return START_NOT_STICKY
                  }
                  startFg("Iniciando...")
                  Thread { boot() }.start()
                  return START_STICKY
              }

              private fun startFg(text: String) {
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(NotificationChannel("rea", "REA Decode", NotificationManager.IMPORTANCE_LOW))
                  val pi = PendingIntent.getActivity(
                      this, 0, Intent(this, MainActivity::class.java),
                      PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                  )
                  val n: Notification = Notification.Builder(this, "rea")
                      .setSmallIcon(android.R.drawable.stat_notify_sync)
                      .setContentTitle("REA Decode ativo")
                      .setContentText(text)
                      .setContentIntent(pi)
                      .setOngoing(true)
                      .build()
                  if (Build.VERSION.SDK_INT >= 34) {
                      startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE)
                  } else {
                      startForeground(1, n)
                  }
              }

              private fun boot() {
                  synchronized(this) {
                      if (server != null) return
                      val p = getSharedPreferences("rea", MODE_PRIVATE)
                      val port = p.getInt("port", 8766)
                      val token = p.getString("token", "") ?: ""
                      AppState.token = token
                      try {
                          val s = McpHttpServer(port, token, ToolRegistry(applicationContext))
                          s.start(NanoHTTPD.SOCKET_READ_TIMEOUT, false)
                          server = s
                          AppState.running = true
                          AppState.log("servidor MCP em 127.0.0.1:$port")
                      } catch (e: Exception) {
                          AppState.log("falha ao abrir porta $port: ${e.message}")
                          AppState.running = false
                          AppState.changed()
                          return
                      }
                      val pm = getSystemService(PowerManager::class.java)
                      wl = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "rea:server").apply { acquire() }
                      AppState.changed()
                      val t = Tunnel(this)
                      tunnel = t
                      t.start(
                          p.getInt("mode", 0), port,
                          p.getString("cf_token", "") ?: "",
                          p.getString("host", "") ?: ""
                      ) { url ->
                          AppState.publicBase = url
                          AppState.log("URL publica: $url")
                          AppState.changed()
                      }
                  }
              }

              private fun shutdown() {
                  synchronized(this) {
                      tunnel?.stop()
                      tunnel = null
                      try {
                          server?.stop()
                      } catch (e: Exception) {
                      }
                      server = null
                      try {
                          wl?.let { if (it.isHeld) it.release() }
                      } catch (e: Exception) {
                      }
                      wl = null
                  }
                  AppState.running = false
                  AppState.publicBase = null
                  AppState.log("servidor parado")
                  AppState.changed()
              }

              override fun onDestroy() {
                  shutdown()
                  super.onDestroy()
              }
          }
