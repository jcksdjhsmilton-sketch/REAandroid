name: Build REA Android APK (Conector Decode)

# Como usar: salve este arquivo como .github/workflows/build-decode.yml no seu repositorio
# (o nome do arquivo importa: o gatilho "push" abaixo so dispara para este caminho).
# Va em Actions > "Build REA Android APK (Conector Decode)" > Run workflow.
# O APK sai em Releases (tag "latest-decode") e tambem como artifact "REA-Android-Decode".
#
# Este workflow e INDEPENDENTE do build-decode principal: gera um segundo app Android,
# com applicationId proprio (app.rea.android.decode), que roda seu PROPRIO servidor MCP
# e seu PROPRIO tunel Cloudflare, expondo um conector separado que so tem as ferramentas
# de decodificar/editar/recompilar um APK (apktool-style). Nao inclui as ferramentas de
# leitura de dex/elf/web do app "REA Android" completo -- isso mantem esse conector menor,
# mais rapido de compilar e com uma superficie de ferramentas enxuta e dedicada.
#
# Ferramentas expostas neste conector:
#   device_info  - info do aparelho + se "acesso a todos os arquivos" esta concedido
#   apk_decode   - decodifica (desempacota) um APK em smali + recursos editaveis
#   list_dir     - navega pastas do projeto decodificado (ou qualquer pasta legivel)
#   inspect_file - inspeciona um arquivo (info/hex/strings/texto)
#   write_file   - edita um arquivo de texto (smali, res/*.xml, AndroidManifest.xml...)
#   apk_build    - recompila o projeto editado de volta em um APK assinado e instalavel

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths: ['.github/workflows/build-decode.yml']

permissions:
  contents: write

jobs:
  build-decode:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-disabled: true

      - name: Restaurar keystore (mantem a mesma assinatura entre builds)
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: rea-debug-keystore-v1

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'

      - name: Gerar projeto Android (todos os arquivos)
        run: |
          set -e
          mkdir -p rea-android-decode
          cd rea-android-decode
          mkdir -p app
          cat > app/build.gradle.kts <<'__REA_EOF__'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "app.rea.android.decode"
              compileSdk = 36

              defaultConfig {
                  applicationId = "app.rea.android.decode"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "0.1.0"
                  ndk { abiFilters += "arm64-v8a" }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
    
              lint {
                  abortOnError = false
                  checkReleaseBuilds = false
              }

              packaging {
                  jniLibs {
                      useLegacyPackaging = true
                      keepDebugSymbols += "**/libcloudflared.so"
                  }
                  resources {
                      excludes += setOf(
                          "META-INF/AL2.0", "META-INF/LGPL2.1", "META-INF/DEPENDENCIES",
                          "META-INF/LICENSE*", "META-INF/NOTICE*", "META-INF/INDEX.LIST"
                      )
                  }
              }
          }

          dependencies {
              implementation("org.nanohttpd:nanohttpd:2.3.1")
              implementation("org.apktool:apktool-lib:3.0.3") {
                  exclude(group = "com.github.iBotPeaches.smali")
              }
              implementation("com.android.tools.build:apksig:8.7.3")
          }
          __REA_EOF__
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'__REA_EOF__'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />

              <application
                  android:label="REA Decode"
