          package app.rea.android

          import android.content.Context
          import org.json.JSONArray
          import org.json.JSONObject

          class Param(val name: String, val type: String, val desc: String, val required: Boolean = false)

          class Tool(val name: String, val desc: String, val params: List<Param>, val fn: (JSONObject) -> Any?) {
              fun schema(): JSONObject {
                  val props = JSONObject()
                  val req = JSONArray()
                  for (p in params) {
                      props.put(p.name, JSONObject().put("type", p.type).put("description", p.desc))
                      if (p.required) req.put(p.name)
                  }
                  return JSONObject().put("type", "object").put("properties", props).put("required", req)
              }
          }

          fun JSONObject.s(k: String, d: String = ""): String = if (has(k) && !isNull(k)) optString(k, d) else d
          fun JSONObject.i(k: String, d: Int): Int = if (has(k) && !isNull(k)) optInt(k, d) else d
          fun JSONObject.b(k: String, d: Boolean): Boolean = if (has(k) && !isNull(k)) optBoolean(k, d) else d

          // Registro ENXUTO, dedicado apenas ao fluxo de decodificar/editar/recompilar um APK.
          // Nao inclui as ferramentas de leitura de dex/elf/web do app "REA Android" completo.
          class ToolRegistry(private val ctx: Context) {
              private val pTarget = Param(
                  "target", "string",
                  "Package name of an installed app (e.g. com.example.app) OR absolute path to an .apk file readable by this app",
                  true
              )

              private fun tgt(a: JSONObject): Target = Core.resolve(ctx, a.s("target"))

              val tools: List<Tool> = listOf(
                  Tool("device_info", "Info about the Android device running this server and whether all-files access is granted.", listOf()) {
                      Core.deviceInfo(ctx)
                  },
                  Tool(
                      "apk_decode", "Decode (unpack) an APK into editable sources (smali code + resources), apktool-style. Returns the project folder; browse with list_dir, read with inspect_file, edit with write_file.",
                      listOf(pTarget, Param("project", "string", "name for the project folder (default: apk filename)"))
                  ) { Edit.decode(ctx, tgt(it), it.s("project")) },
                  Tool(
                      "list_dir", "List a directory (needs all-files access for shared storage). Use it to browse an apk_decode project.",
                      listOf(Param("path", "string", "absolute directory path", true), Param("limit", "integer", "default 300"))
                  ) { Core.listDir(it.s("path"), it.i("limit", 300)) },
                  Tool(
                      "inspect_file", "Inspect any readable file: info (size, magic, sha256), hex, strings or text. Use it to read a decoded project's files.",
                      listOf(
                          Param("path", "string", "absolute file path", true),
                          Param("mode", "string", "info | hex | strings | text (default info)"),
                          Param("offset", "integer", "default 0"),
                          Param("length", "integer", "default 4096, max 131072"),
                          Param("min_len", "integer", "min string length for strings mode (default 6)")
                      )
                  ) { Core.inspectFile(it) },
                  Tool(
                      "write_file", "Write or overwrite a text file (used to edit files from apk_decode: smali, res/*.xml, AndroidManifest.xml, etc).",
                      listOf(
                          Param("path", "string", "absolute file path", true),
                          Param("content", "string", "new full text content", true),
                          Param("append", "boolean", "append instead of overwrite (default false)")
                      )
                  ) { Core.writeFile(it.s("path"), it.s("content"), it.b("append", false)) },
                  Tool(
                      "apk_build", "Rebuild an edited apk_decode project back into a signed, installable APK, saved to Download/REA-builds.",
                      listOf(Param("project", "string", "project name used in apk_decode", true))
                  ) { Edit.build(ctx, it.s("project")) }
              )

              fun find(n: String): Tool? = tools.firstOrNull { it.name == n }
          }
