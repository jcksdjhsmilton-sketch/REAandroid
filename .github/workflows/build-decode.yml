          __REA_EOF__
          mkdir -p app/src/main/java/app/rea/android
          cat > app/src/main/java/app/rea/android/Core.kt <<'__REA_EOF__'
          package app.rea.android

          import android.content.Context
          import android.content.pm.PackageManager
          import android.os.Build
          import android.os.Environment
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.File
          import java.io.InputStream
          import java.security.MessageDigest

          class Target(val path: String, val pkg: String?)

          fun sha256(b: ByteArray): String =
              MessageDigest.getInstance("SHA-256").digest(b).joinToString("") { "%02x".format(it.toInt() and 0xff) }

          fun sha256File(f: File): String {
              val md = MessageDigest.getInstance("SHA-256")
              f.inputStream().use { ins ->
                  val buf = ByteArray(65536)
                  while (true) {
                      val n = ins.read(buf)
                      if (n < 0) break
                      md.update(buf, 0, n)
                  }
              }
              return md.digest().joinToString("") { "%02x".format(it.toInt() and 0xff) }
          }

          fun readRange(ins: InputStream, off: Long, len: Int): ByteArray {
              var skipped = 0L
              while (skipped < off) {
                  val s = ins.skip(off - skipped)
                  if (s <= 0) {
                      if (ins.read() < 0) break
                      skipped++
                  } else {
                      skipped += s
                  }
              }
              val buf = ByteArray(len)
              var n = 0
              while (n < len) {
                  val r = ins.read(buf, n, len - n)
                  if (r < 0) break
                  n += r
              }
              return buf.copyOf(n)
          }

          object Fmt {
              fun render(b: ByteArray, mode: String, base: Long, minLen: Int): String = when (mode) {
                  "hex" -> hex(b, base)
                  "strings" -> strings(b, minLen)
                  else -> {
                      val s = String(b, Charsets.UTF_8)
                      val bad = s.count { it == '\uFFFD' || (it < ' ' && it != '\n' && it != '\r' && it != '\t') }
                      val warn = if (s.isNotEmpty() && bad > s.length / 10) "[aviso: parece binario; use mode=hex ou strings]\n" else ""
                      warn + s
                  }
              }

              fun hex(b: ByteArray, base: Long): String {
                  val sb = StringBuilder()
                  var i = 0
                  while (i < b.size) {
                      sb.append("%08x  ".format(base + i))
                      val end = minOf(i + 16, b.size)
                      for (j in i until i + 16) {
                          if (j < end) sb.append("%02x ".format(b[j].toInt() and 0xff)) else sb.append("   ")
                      }
                      sb.append(" |")
                      for (j in i until end) {
                          val c = b[j].toInt() and 0xff
                          sb.append(if (c in 32..126) c.toChar() else '.')
                      }
                      sb.append("|\n")
                      i += 16
                  }
                  return sb.toString()
              }

              fun strings(b: ByteArray, minLen: Int): String {
                  val sb = StringBuilder()
                  var start = -1
                  var lines = 0
                  for (i in 0..b.size) {
                      val c = if (i < b.size) (b[i].toInt() and 0xff) else 0
                      val printable = c in 32..126 || c == 9
                      if (printable) {
                          if (start < 0) start = i
                      } else {
                          if (start >= 0 && i - start >= minLen) {
                              sb.append(start).append(": ").append(String(b, start, i - start, Charsets.ISO_8859_1)).append('\n')
                              lines++
                              if (lines >= 5000) return sb.append("...[limite de linhas]").toString()
                          }
                          start = -1
                      }
                  }
                  return sb.toString()
              }

              fun magic(b: ByteArray): String {
                  fun st(vararg x: Int): Boolean = b.size >= x.size && x.indices.all { (b[it].toInt() and 0xff) == x[it] }
                  return when {
                      st(0x7f, 0x45, 0x4c, 0x46) -> "ELF"
                      st(0x50, 0x4b, 3, 4) -> "ZIP/APK/JAR"
                      st(0x64, 0x65, 0x78, 0x0a) -> "DEX"
                      st(0x53, 0x51, 0x4c, 0x69) -> "SQLite3"
                      st(0x00, 0x61, 0x73, 0x6d) -> "WebAssembly"
                      st(0x89, 0x50, 0x4e, 0x47) -> "PNG"
                      st(0x25, 0x50, 0x44, 0x46) -> "PDF"
                      st(0x03, 0x00, 0x08, 0x00) -> "Android binary XML"
                      st(0x1f, 0x8b) -> "gzip"
                      st(0x4d, 0x5a) -> "PE/DOS (MZ)"
                      st(0xfe, 0xed, 0xfa, 0xce) || st(0xcf, 0xfa, 0xed, 0xfe) -> "Mach-O"
                      else -> "desconhecido"
                  }
              }
          }

          object Core {
              fun resolve(ctx: Context, t: String): Target {
                  require(t.isNotBlank()) { "target vazio" }
                  if (t.startsWith("/")) {
                      val f = File(t)
                      require(f.exists()) { "arquivo nao existe: $t" }
                      require(f.canRead()) { "sem permissao para ler $t (conceda 'acesso a todos os arquivos' ao app)" }
                      return Target(t, null)
                  }
                  try {
                      val ai = ctx.packageManager.getApplicationInfo(t, 0)
                      return Target(ai.sourceDir, t)
                  } catch (e: PackageManager.NameNotFoundException) {
                      throw IllegalArgumentException("pacote nao instalado: $t")
                  }
              }

              fun deviceInfo(ctx: Context): JSONObject {
                  val allFiles = if (Build.VERSION.SDK_INT >= 30) Environment.isExternalStorageManager() else true
                  return JSONObject()
                      .put("manufacturer", Build.MANUFACTURER)
                      .put("model", Build.MODEL)
                      .put("android", Build.VERSION.RELEASE)
                      .put("sdk", Build.VERSION.SDK_INT)
                      .put("abis", JSONArray(Build.SUPPORTED_ABIS.toList()))
                      .put("allFilesAccess", allFiles)
                      .put("externalStorage", Environment.getExternalStorageDirectory().absolutePath)
                      .put("appFilesDir", ctx.filesDir.absolutePath)
              }

              fun inspectFile(a: JSONObject): Any {
                  val f = File(a.s("path"))
                  require(f.exists()) { "arquivo nao existe" }
                  require(f.isFile) { "nao e um arquivo" }
                  require(f.canRead()) { "sem permissao de leitura (conceda acesso a todos os arquivos)" }
                  val mode = a.s("mode", "info")
                  val off = a.i("offset", 0).toLong()
                  val len = minOf(a.i("length", 4096), 131072)
                  if (mode == "info") {
                      val head = f.inputStream().use { readRange(it, 0, 16) }
                      val o = JSONObject().put("path", f.absolutePath).put("size", f.length())
                          .put("modified", f.lastModified()).put("magic", Fmt.magic(head))
                      if (f.length() < 600L * 1024 * 1024) o.put("sha256", sha256File(f))
                      return o
                  }
                  val bytes = f.inputStream().use { readRange(it, off, len) }
                  return Fmt.render(bytes, mode, off, a.i("min_len", 6))
              }

              fun listDir(path: String, limit: Int): JSONObject {
                  val d = File(path)
                  require(d.isDirectory) { "nao e um diretorio: $path" }
                  val list = d.listFiles() ?: throw IllegalArgumentException("sem permissao para listar $path")
                  val arr = JSONArray()
                  for (f in list.sortedBy { it.name.lowercase() }.take(limit)) {
                      arr.put(
                          JSONObject().put("name", f.name).put("dir", f.isDirectory)
                              .put("size", if (f.isFile) f.length() else JSONObject.NULL).put("modified", f.lastModified())
                      )
                  }
                  return JSONObject().put("path", path).put("total", list.size).put("entries", arr)
              }

              fun writeFile(path: String, content: String, append: Boolean): JSONObject {
                  val f = File(path)
                  f.parentFile?.mkdirs()
                  if (append) f.appendText(content) else f.writeText(content)
                  return JSONObject().put("path", f.absolutePath).put("bytes", f.length())
              }
          }
          __REA_EOF__
          mkdir -p app/src/main/java/app/rea/android
          cat > app/src/main/java/app/rea/android/AppState.kt <<'__REA_EOF__'
          package app.rea.android

          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          object AppState {
              @Volatile var running = false
              @Volatile var publicBase: String? = null
              @Volatile var token = ""
              @Volatile var listener: (() -> Unit)? = null

              private val logs = ArrayDeque<String>()
              private val fmt = SimpleDateFormat("HH:mm:ss", Locale.US)

              @Synchronized
              fun log(msg: String) {
                  logs.addLast(fmt.format(Date()) + "  " + msg)
                  while (logs.size > 250) logs.removeFirst()
                  listener?.invoke()
              }

              @Synchronized
              fun logText(): String = logs.joinToString("\n")

              fun changed() {
                  listener?.invoke()
              }

              fun connectorUrl(): String? {
                  val b = publicBase ?: return null
                  return b.trimEnd('/') + "/mcp/" + token
              }
          }
          __REA_EOF__
          mkdir -p app/src/main/java/app/rea/android
          cat > app/src/main/java/app/rea/android/Edit.kt <<'__REA_EOF__'
          package app.rea.android

          import android.content.Context
          import android.os.Environment
          import com.android.apksig.ApkSigner
          import org.json.JSONObject
          import java.io.File
          import java.security.KeyStore
          import java.security.PrivateKey
          import java.security.cert.X509Certificate

          // Port do apktool: DECODIFICAR um apk em smali+recursos editaveis e RECONSTRUIR + ASSINAR
          // de volta um apk instalavel (debug key do CI, embutida em res/raw/rea_debug.keystore).
          // O apktool-lib 3.x mudou a API publica; a integracao usa reflexao para nao depender de
          // assinaturas exatas. Se algo nao existir, o erro de runtime diz exatamente o que faltou.
          object Edit {
              private fun projectsRoot(ctx: Context): File {
                  val d = File(ctx.getExternalFilesDir(null), "projects")
                  d.mkdirs()
                  return d
              }

                  private fun describe(c: Class<*>): String {
                  val sb = StringBuilder(c.name + " ctors=")
                  for (k in c.declaredConstructors) sb.append(k.parameterTypes.joinToString(",", "(", ")") { it.simpleName })
                  sb.append(" statics=")
                  for (m in c.declaredMethods) if (java.lang.reflect.Modifier.isStatic(m.modifiers)) sb.append(m.name + m.parameterTypes.joinToString(",", "(", ")") { it.simpleName } + ":" + m.returnType.simpleName + " ")
                  return sb.toString()
              }

              private fun defaultFor(t: Class<*>): Any? = when {
                  t == String::class.java -> "3.0.3"
                  t == java.lang.Boolean.TYPE || t == java.lang.Boolean::class.java -> false
                  t == Integer.TYPE || t == java.lang.Integer::class.java -> 0
                  t == java.lang.Long.TYPE -> 0L
                  else -> null
              }

              // apktool-lib 3.x mudou como criar Config: tenta metodos estaticos sem argumento que
              // retornam Config, depois qualquer construtor preenchendo parametros com valores padrao.
              private fun newConfig(): Any {
                  val c = Class.forName("brut.androlib.Config")
                  for (m in c.declaredMethods) {
                      if (java.lang.reflect.Modifier.isStatic(m.modifiers) && m.parameterTypes.isEmpty() && c.isAssignableFrom(m.returnType)) {
                          try { m.isAccessible = true; val r = m.invoke(null); if (r != null) return r } catch (e: Exception) { }
                      }
                  }
                  for (k in c.declaredConstructors.sortedBy { it.parameterTypes.size }) {
                      try {
                          k.isAccessible = true
                          val args = k.parameterTypes.map { defaultFor(it) }.toTypedArray()
                          return k.newInstance(*args)
                      } catch (e: Exception) { }
                  }
                  throw IllegalStateException("nao consegui criar Config. API: " + describe(c))
              }

          // Cria objeto com construtor de 2 parametros (Config, File) em qualquer ordem.
              private fun construct(clsName: String, config: Any, file: File): Any {
                  val cls = Class.forName(clsName)
                  for (ctor in cls.constructors) {
                      val ps = ctor.parameterTypes
                      if (ps.size != 2) continue
                      val args = arrayOfNulls<Any>(2)
                      var ok = true
                      for (i in 0..1) {
                          val p = ps[i]
                          args[i] = when {
                              p.isInstance(config) -> config
                              p == File::class.java -> file
                              p.simpleName == "ExtFile" -> p.getConstructor(File::class.java).newInstance(file)
                              else -> { ok = false; null }
                          }
                      }
                      if (ok) { try { return ctor.newInstance(*args) } catch (e: java.lang.reflect.InvocationTargetException) { throw (e.targetException ?: e) } }
                  }
                  throw IllegalStateException("construtor de " + clsName + "(Config, File) nao encontrado nesta versao do apktool-lib")
              }

              // Chama um metodo de 1 parametro (File ou ExtFile) pelo nome.
              private fun call(obj: Any, name: String, arg: File): Any? {
                  for (m in obj.javaClass.methods) {
                      if (m.name != name || m.parameterTypes.size != 1) continue
                      val p = m.parameterTypes[0]
                      val a: Any = when {
                          p == File::class.java -> arg
                          p.simpleName == "ExtFile" -> p.getConstructor(File::class.java).newInstance(arg)
                          else -> continue
                      }
                      try { return m.invoke(obj, a) } catch (e: java.lang.reflect.InvocationTargetException) { throw (e.targetException ?: e) }
                  }
                  throw IllegalStateException("metodo " + name + "(File) nao encontrado em " + obj.javaClass.name)
              }

              fun decode(ctx: Context, target: Target, projectName: String): JSONObject {
                  val apk = File(target.path)
                  if (!apk.exists()) throw IllegalArgumentException("apk nao encontrado: " + target.path)
                  val name = if (projectName.isNotBlank()) projectName else apk.nameWithoutExtension
                  val outDir = File(projectsRoot(ctx), name)
                  if (outDir.exists()) outDir.deleteRecursively()
                  val decoder = construct("brut.androlib.ApkDecoder", newConfig(), apk)
                  call(decoder, "decode", outDir)
                  var count = 0
                  outDir.walkTopDown().forEach { if (it.isFile) count++ }
                  return JSONObject()
                      .put("project", name)
                      .put("path", outDir.absolutePath)
                      .put("files", count)
                      .put("hint", "Use list_dir/inspect_file para navegar e write_file para editar (smali/*, res/*, AndroidManifest.xml). Depois chame apk_build com project=\"" + name + "\".")
              }

              fun build(ctx: Context, projectName: String): JSONObject {
                  val projDir = File(projectsRoot(ctx), projectName)
                  if (!projDir.isDirectory) throw IllegalArgumentException("projeto nao encontrado: " + projectName + " (rode apk_decode primeiro)")
                  val outDir = File(Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS), "REA-builds")
                  outDir.mkdirs()
                  val unsigned = File(outDir, projectName + "-unsigned.apk")
                  if (unsigned.exists()) unsigned.delete()
                  val builder = construct("brut.androlib.ApkBuilder", newConfig(), projDir)
                  call(builder, "build", unsigned)
                  val signed = File(outDir, projectName + "-signed.apk")
                  if (signed.exists()) signed.delete()
                  signApk(ctx, unsigned, signed)
                  unsigned.delete()
                  return JSONObject()
                      .put("project", projectName)
                      .put("apk", signed.absolutePath)
                      .put("sha256", sha256File(signed))
                      .put("note", "Assinado com a debug key do CI. Abra o arquivo no gerenciador de arquivos para instalar (pode pedir pra permitir instalar apps desconhecidos).")
              }

              private fun signApk(ctx: Context, input: File, output: File) {
                  val ks = KeyStore.getInstance("PKCS12")
                  ctx.resources.openRawResource(R.raw.rea_debug).use { ks.load(it, "android".toCharArray()) }
                  val key = ks.getKey("androiddebugkey", "android".toCharArray()) as PrivateKey
                  val cert = ks.getCertificate("androiddebugkey") as X509Certificate
                  val signerConfig = ApkSigner.SignerConfig.Builder("REA", key, listOf(cert)).build()
                  ApkSigner.Builder(listOf(signerConfig))
                      .setInputApk(input)
                      .setOutputApk(output)
                      .setV1SigningEnabled(true)
                      .setV2SigningEnabled(true)
                      .setV3SigningEnabled(true)
                      .build()
                      .sign()
              }
          }
          __REA_EOF__
          mkdir -p app/src/main/java/app/rea/android
          cat > app/src/main/java/app/rea/android/MainActivity.kt <<'__REA_EOF__'
          package app.rea.android

          import android.Manifest
          import android.app.Activity
          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Context
          import android.content.Intent
          import android.content.SharedPreferences
          import android.graphics.Typeface
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.provider.Settings
          import android.text.InputType
          import android.view.View
          import android.widget.AdapterView
          import android.widget.ArrayAdapter
          import android.widget.Button
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.Spinner
          import android.widget.TextView
          import android.widget.Toast
          import java.security.SecureRandom

          class MainActivity : Activity() {
              private lateinit var prefs: SharedPreferences
              private lateinit var tvStatus: TextView
              private lateinit var tvUrl: TextView
              private lateinit var tvLog: TextView
              private lateinit var btnToggle: Button
              private lateinit var spMode: Spinner
              private lateinit var etCf: EditText
              private lateinit var etHost: EditText
              private lateinit var etPort: EditText
              private val ui = Handler(Looper.getMainLooper())

              private fun dp(v: Int): Int = (v * resources.displayMetrics.density).toInt()

              private fun label(t: String, size: Float = 14f, bold: Boolean = false): TextView {
                  val v = TextView(this)
                  v.text = t
                  v.textSize = size
                  if (bold) v.setTypeface(null, Typeface.BOLD)
                  v.setPadding(0, dp(8), 0, dp(4))
                  return v
              }

              private fun button(t: String, onClick: () -> Unit): Button {
                  val b = Button(this)
                  b.text = t
                  b.isAllCaps = false
                  b.setOnClickListener { onClick() }
                  return b
              }

              private fun newToken() {
                  val b = ByteArray(24)
                  SecureRandom().nextBytes(b)
                  val t = b.joinToString("") { "%02x".format(it.toInt() and 0xff) }
                  prefs.edit().putString("token", t).apply()
                  AppState.token = t
