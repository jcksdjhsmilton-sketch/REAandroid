          package app.rea.android

          import android.content.Context
          import org.json.JSONArray
          import org.json.JSONObject

          class Param(val name: String, val type: String, val desc: String, val required: Boolean = false)

          class Tool(val name: String, val desc: String, val params: List<Param>, val fn: (JSONObject) -> Any?) {
              fun schema(): JSONObject {
                  val props = JSONObject()
                  val req = JSONArray()
                  for (p in params) {
                      props.put(p.name, JSONObject().put("type", p.type).put("description", p.desc))
                      if (p.required) req.put(p.name)
                  }
                  return JSONObject().put("type", "object").put("properties", props).put("required", req)
              }
          }

          fun JSONObject.s(k: String, d: String = ""): String = if (has(k) && !isNull(k)) optString(k, d) else d
          fun JSONObject.i(k: String, d: Int): Int = if (has(k) && !isNull(k)) optInt(k, d) else d
          fun JSONObject.b(k: String, d: Boolean): Boolean = if (has(k) && !isNull(k)) optBoolean(k, d) else d

          class ToolRegistry(private val ctx: Context) {
              private val pTarget = Param(
                  "target", "string",
                  "Package name of an installed app (e.g. com.example.app) OR absolute path to an .apk/.so/.dex file readable by this app",
                  true
              )

              private fun tgt(a: JSONObject): Target = Core.resolve(ctx, a.s("target"))

              val tools: List<Tool> = listOf(
                  Tool("device_info", "Info about the Android device running this server and whether all-files access is granted.", listOf()) {
                      Core.deviceInfo(ctx)
                  },
                  Tool(
                      "list_apps", "List installed apps (package, label, apk path). System apps hidden by default.",
                      listOf(
                          Param("filter", "string", "substring of label or package name"),
                          Param("include_system", "boolean", "include system apps (default false)"),
                          Param("limit", "integer", "max rows (default 100)")
                      )
                  ) { Core.listApps(ctx, it) },
                  Tool(
                      "app_info", "Detailed info of an installed app: versions, SDKs, permissions (granted?), activities/services/receivers/providers with exported flag, signing certificates, install source.",
                      listOf(Param("package", "string", "package name", true))
                  ) { Core.appInfo(ctx, it.s("package")) },
                  Tool(
                      "extract_apk", "Copy base + split APKs of an installed app to this app's external files dir (Android/data/app.rea.android/files/apks) and return paths and SHA-256.",
                      listOf(Param("package", "string", "package name", true))
                  ) { Core.extractApk(ctx, it.s("package")) },
                  Tool(
                      "apk_overview", "Overview of an APK: hashes, dex files, native libs per ABI, asset/res counts, signature files, detected frameworks (Flutter, React Native, Unity, Xamarin, Cordova...), possible packers, package info and certificates.",
                      listOf(pTarget)
                  ) { Apk.overview(ctx, tgt(it)) },
                  Tool(
                      "apk_list_files", "List entries inside an APK/zip with sizes. Supports prefix filter and pagination.",
                      listOf(
                          pTarget,
                          Param("prefix", "string", "only entries starting with this, e.g. assets/ or lib/arm64-v8a/"),
                          Param("offset", "integer", "pagination offset (default 0)"),
                          Param("limit", "integer", "max entries (default 200)")
                      )
                  ) { Apk.listFiles(tgt(it).path, it.s("prefix"), it.i("offset", 0), it.i("limit", 200)) },
                  Tool(
                      "apk_read_file", "Read bytes of one entry inside an APK as text, hex dump or printable strings. Max 131072 bytes per call.",
                      listOf(
                          pTarget,
                          Param("entry", "string", "entry path inside the zip", true),
                          Param("mode", "string", "text | hex | strings (default text)"),
                          Param("offset", "integer", "byte offset (default 0)"),
                          Param("length", "integer", "bytes to read (default 16384, max 131072)")
                      )
                  ) { Apk.readEntry(tgt(it).path, it.s("entry"), it.s("mode", "text"), it.i("offset", 0), it.i("length", 16384)) },
                  Tool(
