          __REA_EOF__
          mkdir -p app/src/main/java/app/rea/android
          cat > app/src/main/java/app/rea/android/Tunnel.kt <<'__REA_EOF__'
          package app.rea.android

          import android.content.Context
          import java.io.BufferedReader
          import java.io.File
          import java.io.InputStreamReader

          class Tunnel(private val ctx: Context) {
              private var proc: Process? = null

              private fun normalize(h: String): String {
                  val t = h.trim().trimEnd('/')
                  if (t.isEmpty()) return ""
                  return if (t.startsWith("http://") || t.startsWith("https://")) t else "https://$t"
              }

              // mode 0 = Cloudflare rapido, 1 = Cloudflare nomeado (token), 2 = URL manual
              fun start(mode: Int, port: Int, cfToken: String, host: String, onUrl: (String) -> Unit) {
                  if (mode == 2) {
                      val u = normalize(host)
                      if (u.isEmpty()) AppState.log("informe a URL publica no campo de dominio") else onUrl(u)
                      return
                  }
                  val bin = File(ctx.applicationInfo.nativeLibraryDir, "libcloudflared.so")
                  if (!bin.exists()) {
                      AppState.log("cloudflared ausente: ${bin.path}")
                      return
                  }
                  val args = arrayListOf(bin.absolutePath, "tunnel", "--no-autoupdate", "--protocol", "http2")
                  if (mode == 1) {
                      if (cfToken.isBlank()) {
                          AppState.log("informe o token do tunel Cloudflare")
                          return
                      }
                      args.addAll(listOf("run", "--token", cfToken.trim()))
                  } else {
                      args.addAll(listOf("--url", "http://127.0.0.1:$port"))
                  }
                  try {
                      val pb = ProcessBuilder(args).redirectErrorStream(true)
                      pb.environment()["HOME"] = ctx.filesDir.absolutePath
                      pb.environment()["TMPDIR"] = ctx.cacheDir.absolutePath
                      val p = pb.start()
                      proc = p
                      AppState.log("cloudflared iniciado")
                      if (mode == 1) {
                          val u = normalize(host)
                          if (u.isNotEmpty()) onUrl(u) else AppState.log("informe o dominio publico configurado no tunel")
                      }
                      Thread {
                          try {
                              val re = Regex("https://[a-z0-9-]+\\.trycloudflare\\.com")
                              BufferedReader(InputStreamReader(p.inputStream)).forEachLine { line ->
                                  AppState.log("cf: " + line.take(180))
                                  if (mode == 0) {
                                      val m = re.find(line)
                                      if (m != null && !m.value.contains("//api.")) onUrl(m.value)
                                  }
                              }
                          } catch (e: Exception) {
                              AppState.log("leitura do cloudflared falhou: ${e.message}")
                          }
                          AppState.log("cloudflared encerrou")
                      }.start()
                  } catch (e: Exception) {
                      AppState.log("falha ao executar cloudflared: ${e.message}")
                  }
              }

              fun stop() {
                  try {
                      proc?.destroyForcibly()
                  } catch (e: Exception) {
                  }
                  proc = null
              }
          }
          __REA_EOF__
          mkdir -p app/src/main/java/app/rea/android
          cat > app/src/main/java/app/rea/android/Web.kt <<'__REA_EOF__'
          package app.rea.android

          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.ByteArrayOutputStream
          import java.net.HttpURLConnection
          import java.net.URL

          object Web {
              class Resp(
                  val status: Int,
                  val finalUrl: String,
                  val headers: JSONObject,
                  val bytes: ByteArray,
                  val truncated: Boolean,
                  val ctype: String
              )

              fun fetch(url: String, method: String, headers: JSONObject?, body: String?, maxBytes: Int): Resp {
                  require(url.startsWith("http://") || url.startsWith("https://")) { "use uma URL http(s)" }
                  val c = URL(url).openConnection() as HttpURLConnection
                  c.requestMethod = method.uppercase()
                  c.connectTimeout = 15000
                  c.readTimeout = 25000
                  c.instanceFollowRedirects = true
                  c.setRequestProperty("User-Agent", "Mozilla/5.0 (Linux; Android 14) REA-Android/0.1")
                  if (headers != null) {
                      val it = headers.keys()
                      while (it.hasNext()) {
                          val k = it.next()
                          c.setRequestProperty(k, headers.getString(k))
                      }
                  }
                  if (body != null) {
                      c.doOutput = true
                      c.outputStream.use { it.write(body.toByteArray()) }
                  }
                  val code = c.responseCode
                  val ins = if (code >= 400) c.errorStream else c.inputStream
                  val out = ByteArrayOutputStream()
                  var trunc = false
                  if (ins != null) {
                      ins.use { s ->
                          val buf = ByteArray(16384)
                          while (true) {
                              val n = s.read(buf)
                              if (n < 0) break
                              if (out.size() + n > maxBytes) {
                                  out.write(buf, 0, maxBytes - out.size())
                                  trunc = true
                                  break
                              }
                              out.write(buf, 0, n)
                          }
                      }
                  }
                  val h = JSONObject()
                  for ((k, v) in c.headerFields) if (k != null) h.put(k, v.joinToString(", "))
                  return Resp(code, c.url.toString(), h, out.toByteArray(), trunc, c.contentType ?: "")
              }

              fun fetchTool(a: JSONObject): JSONObject {
                  val r = fetch(a.s("url"), a.s("method", "GET"), a.optJSONObject("headers"), if (a.has("body")) a.s("body") else null, a.i("max_bytes", 200000))
                  val textual = r.ctype.contains("text") || r.ctype.contains("json") || r.ctype.contains("xml") ||
                      r.ctype.contains("javascript") || r.ctype.isEmpty()
                  return JSONObject()
                      .put("status", r.status)
                      .put("finalUrl", r.finalUrl)
                      .put("contentType", r.ctype)
                      .put("truncated", r.truncated)
                      .put("headers", r.headers)
                      .put("body", if (textual) String(r.bytes, Charsets.UTF_8) else "<binario " + r.bytes.size + " bytes sha256=" + sha256(r.bytes) + ">")
              }

              private val urlRe = Regex("""https?://[^\s"'<>\\)]+""")
              private val pathRe = Regex("""["'](/[A-Za-z0-9_\-./]*(?:api|graphql|oauth|auth|login|rest|v\d+)[A-Za-z0-9_\-./?=&%]*)["']""")

              fun analyze(url: String): JSONObject {
                  val started = System.currentTimeMillis()
                  val r = fetch(url, "GET", null, null, 2_000_000)
                  val html = String(r.bytes, Charsets.UTF_8)
                  val base = URL(r.finalUrl)
                  fun abs(u: String): String = try { URL(base, u).toString() } catch (e: Exception) { u }
                  val title = Regex("<title[^>]*>(.*?)</title>", setOf(RegexOption.IGNORE_CASE, RegexOption.DOT_MATCHES_ALL))
                      .find(html)?.groupValues?.get(1)?.trim()
                  val scripts = Regex("<script[^>]+src=[\"']([^\"']+)[\"']", RegexOption.IGNORE_CASE)
                      .findAll(html).map { abs(it.groupValues[1]) }.distinct().toList()
                  val inline = Regex("<script(?![^>]*src=)[^>]*>", RegexOption.IGNORE_CASE).findAll(html).count()
                  val links = Regex("<(?:a|link|form|iframe)[^>]+(?:href|action|src)=[\"']([^\"'#][^\"']*)[\"']", RegexOption.IGNORE_CASE)
                      .findAll(html).map { abs(it.groupValues[1]) }.distinct().take(60).toList()
                  val pageUrls = urlRe.findAll(html).map { it.value }.distinct().take(40).toList()

                  val perScript = JSONArray()
                  for (s in scripts.filter { it.startsWith("http") }.take(10)) {
                      if (System.currentTimeMillis() - started > 45000) {
                          perScript.put(JSONObject().put("note", "tempo esgotado; restantes ignorados"))
                          break
                      }
                      try {
                          val sr = fetch(s, "GET", null, null, 1_500_000)
                          val js = String(sr.bytes, Charsets.UTF_8)
                          val urls = urlRe.findAll(js).map { it.value }.distinct().take(40).toList()
                          val paths = pathRe.findAll(js).map { it.groupValues[1] }.distinct().take(40).toList()
                          perScript.put(
                              JSONObject().put("url", s).put("status", sr.status).put("bytes", sr.bytes.size)
                                  .put("truncated", sr.truncated)
                                  .put("sourceMap", js.contains("sourceMappingURL="))
                                  .put("urls", JSONArray(urls)).put("apiLikePaths", JSONArray(paths))
                          )
                      } catch (e: Exception) {
                          perScript.put(JSONObject().put("url", s).put("error", e.message ?: ""))
                      }
                  }
                  return JSONObject()
                      .put("finalUrl", r.finalUrl)
                      .put("status", r.status)
                      .put("title", title ?: JSONObject.NULL)
                      .put("scripts", JSONArray(scripts))
                      .put("inlineScripts", inline)
                      .put("links", JSONArray(links))
                      .put("urlsInHtml", JSONArray(pageUrls))
                      .put("scriptAnalysis", perScript)
              }
          }
          __REA_EOF__
