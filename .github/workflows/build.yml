name: Build REA Android APK

# Como usar: crie o arquivo .github/workflows/build.yml no seu repositorio com este conteudo,
# va na aba Actions > "Build REA Android APK" > Run workflow. O APK sai em Releases (tag "latest")
# e tambem como artifact. Este unico arquivo gera todo o projeto Android e compila.

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths: ['.github/workflows/build.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-disabled: true

      - name: Restaurar keystore (mantem a mesma assinatura entre builds)
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: rea-debug-keystore-v1

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'

      - name: Gerar projeto Android (todos os arquivos)
        run: |
          set -e
          mkdir -p rea-android
          cd rea-android
          mkdir -p app
          cat > app/build.gradle.kts <<'__REA_EOF__'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "app.rea.android"
              compileSdk = 36

              defaultConfig {
                  applicationId = "app.rea.android"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "0.1.0"
                  ndk { abiFilters += "arm64-v8a" }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
    
              lint {
                  abortOnError = false
                  checkReleaseBuilds = false
              }

              packaging {
                  jniLibs {
                      useLegacyPackaging = true
                      keepDebugSymbols += "**/libcloudflared.so"
                  }
                  resources {
                      excludes += setOf(
                          "META-INF/AL2.0", "META-INF/LGPL2.1", "META-INF/DEPENDENCIES",
                          "META-INF/LICENSE*", "META-INF/NOTICE*", "META-INF/INDEX.LIST"
                      )
                  }
              }
          }

          dependencies {
              implementation("org.nanohttpd:nanohttpd:2.3.1")
              implementation("org.smali:dexlib2:2.4.0")
              implementation("org.smali:baksmali:2.4.0")
              implementation("org.smali:util:2.4.0")
              implementation("org.apktool:apktool-lib:3.0.3") {
                  exclude(group = "com.github.iBotPeaches.smali")
              }
              implementation("com.android.tools.build:apksig:8.7.3")
          }
          __REA_EOF__
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'__REA_EOF__'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />

              <application
                  android:label="REA Android"
                  android:allowBackup="false"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".McpService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="local_mcp_server_and_tunnel" />
                  </service>
              </application>
          </manifest>
          __REA_EOF__
          mkdir -p app/src/main/java/app/rea/android
          cat > app/src/main/java/app/rea/android/Apk.kt <<'__REA_EOF__'
          package app.rea.android

          import android.content.Context
          import android.content.pm.PackageManager
          import android.content.res.Resources
          import android.os.Build
          import org.jf.baksmali.Adaptors.ClassDefinition
          import org.jf.baksmali.BaksmaliOptions
          import org.jf.dexlib2.Opcodes
          import org.jf.dexlib2.dexbacked.DexBackedDexFile
          import org.jf.dexlib2.iface.ClassDef
          import org.jf.dexlib2.iface.instruction.ReferenceInstruction
          import org.jf.dexlib2.util.ReferenceUtil
          import org.jf.util.IndentingWriter
          import org.json.JSONArray
          import org.json.JSONObject
          import org.xmlpull.v1.XmlPullParser
          import java.io.File
          import java.io.StringWriter
          import java.nio.ByteBuffer
          import java.nio.ByteOrder
          import java.util.TreeMap
          import java.util.zip.ZipFile

          object Apk {
              private val DEX_RE = Regex("classes\\d*\\.dex")
              private const val ANDROID_NS = "http://schemas.android.com/apk/res/android"

              private class Loaded(val bytes: ByteArray, val dex: DexBackedDexFile)

              private val cache = object : LinkedHashMap<String, Loaded>(4, 0.75f, true) {
                  override fun removeEldestEntry(eldest: MutableMap.MutableEntry<String, Loaded>?): Boolean = size > 3
              }

              fun dexNames(path: String): List<String> = ZipFile(path).use { z ->
                  val names = ArrayList<String>()
                  for (e in z.entries()) if (DEX_RE.matches(e.name)) names.add(e.name)
                  names.sortedBy { it.removePrefix("classes").removeSuffix(".dex").toIntOrNull() ?: 1 }
              }

              private fun load(path: String, entry: String): Loaded = synchronized(cache) {
                  val key = path + "|" + entry + "|" + File(path).lastModified()
                  cache[key] ?: run {
                      val bytes = ZipFile(path).use { z ->
                          val e = z.getEntry(entry) ?: throw IllegalArgumentException("entrada nao existe: $entry")
                          z.getInputStream(e).use { it.readBytes() }
                      }
                      val l = Loaded(bytes, DexBackedDexFile(Opcodes.forApi(34), bytes))
                      cache[key] = l
                      l
                  }
              }

              private fun namesFor(path: String, sel: String): List<String> {
                  val all = dexNames(path)
                  require(all.isNotEmpty()) { "nenhum classes*.dex neste arquivo" }
                  if (sel.isEmpty()) return all
                  require(all.contains(sel)) { "dex nao encontrado: $sel (existentes: $all)" }
                  return listOf(sel)
              }

              fun norm(n: String): String {
                  val s = n.trim()
                  return if (s.startsWith("L") && s.endsWith(";")) s else "L" + s.replace('.', '/') + ";"
              }

              private fun findClass(path: String, cls: String): Pair<String, ClassDef> {
                  val type = norm(cls)
                  for (d in dexNames(path)) {
                      val l = load(path, d)
                      for (c in l.dex.classes) if (c.type == type) return Pair(d, c)
                  }
                  throw IllegalArgumentException("classe nao encontrada: $type")
              }

              private fun flags(f: Int): String {
                  val n = ArrayList<String>()
                  if ((f and 0x1) != 0) n.add("public")
                  if ((f and 0x2) != 0) n.add("private")
                  if ((f and 0x4) != 0) n.add("protected")
                  if ((f and 0x8) != 0) n.add("static")
                  if ((f and 0x10) != 0) n.add("final")
                  if ((f and 0x200) != 0) n.add("interface")
                  if ((f and 0x400) != 0) n.add("abstract")
                  if ((f and 0x100) != 0) n.add("native")
                  if ((f and 0x20) != 0) n.add("synchronized")
                  if ((f and 0x10000) != 0) n.add("constructor")
                  return n.joinToString(" ")
              }

              private fun sig(c: ClassDef, m: org.jf.dexlib2.iface.Method): String =
                  c.type + "->" + m.name + "(" + m.parameterTypes.joinToString("") + ")" + m.returnType

              // ---------- overview / zip ----------

              private fun detect(n: String, fw: MutableSet<String>) {
                  val l = n.lowercase()
                  when {
                      l.endsWith("libflutter.so") || l.startsWith("assets/flutter_assets") -> fw.add("Flutter")
                      l.endsWith("libreactnativejni.so") || l.endsWith("libhermes.so") || l.endsWith("index.android.bundle") -> fw.add("React Native")
                      l.endsWith("libunity.so") -> fw.add("Unity")
                      l.endsWith("libil2cpp.so") -> fw.add("Unity IL2CPP")
                      l.endsWith("libmonodroid.so") || l.startsWith("assemblies/") -> fw.add("Xamarin/.NET (Mono)")
                      l.startsWith("assets/www/") || l.endsWith("cordova.js") -> fw.add("Cordova/Ionic/Capacitor (WebView)")
                      l.endsWith("libgodot_android.so") -> fw.add("Godot")
                      l.contains("libcocos") -> fw.add("Cocos2d")
                      l.contains("libgdx") -> fw.add("libGDX")
                      l.contains("libjiagu") || l.contains("libsecexe") || l.contains("libdexhelper") ||
                          l.contains("libprotectclass") || l.contains("libnqshield") || l.contains("libshell") ->
                          fw.add("Possivel packer/protecao: $n")
                      l.startsWith("kotlin/") -> fw.add("Kotlin")
                  }
              }

              @Suppress("DEPRECATION")
              fun overview(ctx: Context, t: Target): JSONObject {
                  val f = File(t.path)
                  val dex = JSONArray()
                  val libs = TreeMap<String, MutableList<String>>()
                  val fw = linkedSetOf<String>()
                  val sigs = JSONArray()
                  var assets = 0
                  var res = 0
                  var entries = 0
                  var hasManifest = false
                  var hasArsc = false
                  ZipFile(f).use { z ->
                      for (e in z.entries()) {
                          entries++
                          val n = e.name
                          if (DEX_RE.matches(n)) {
                              dex.put(JSONObject().put("name", n).put("size", e.size))
                          } else if (n.startsWith("lib/")) {
                              val p = n.split("/")
                              if (p.size >= 3) libs.getOrPut(p[1]) { ArrayList() }.add(p.drop(2).joinToString("/") + " (" + e.size + ")")
                          } else if (n.startsWith("assets/")) {
                              assets++
                          } else if (n.startsWith("res/")) {
                              res++
                          } else if (n.startsWith("META-INF/") &&
                              (n.endsWith(".RSA") || n.endsWith(".DSA") || n.endsWith(".EC") || n.endsWith(".SF") || n.endsWith("MANIFEST.MF"))
                          ) {
                              sigs.put(n)
                          }
                          if (n == "AndroidManifest.xml") hasManifest = true
                          if (n == "resources.arsc") hasArsc = true
                          detect(n, fw)
                      }
                  }
                  val libsJson = JSONObject()
                  for ((abi, list) in libs) libsJson.put(abi, JSONArray(list))
                  val info = JSONObject()
                  try {
                      val flags = if (Build.VERSION.SDK_INT >= 28) PackageManager.GET_SIGNING_CERTIFICATES else PackageManager.GET_SIGNATURES
                      val pi = ctx.packageManager.getPackageArchiveInfo(t.path, flags)
                      if (pi != null) {
                          val ai = pi.applicationInfo!!
                          info.put("package", pi.packageName)
                          info.put("versionName", pi.versionName ?: JSONObject.NULL)
                          info.put("minSdk", ai.minSdkVersion)
                          info.put("targetSdk", ai.targetSdkVersion)
                          info.put("certificates", Core.certs(pi))
                      }
                  } catch (e: Exception) {
                      info.put("error", e.message ?: "")
                  }
                  return JSONObject()
                      .put("path", t.path)
                      .put("package", t.pkg ?: JSONObject.NULL)
                      .put("sizeBytes", f.length())
                      .put("sha256", sha256File(f))
                      .put("entries", entries)
                      .put("hasManifest", hasManifest)
                      .put("hasResourcesArsc", hasArsc)
                      .put("assetsCount", assets)
                      .put("resCount", res)
                      .put("dex", dex)
                      .put("nativeLibs", libsJson)
                      .put("signatureFiles", sigs)
                      .put("detected", JSONArray(fw.toList()))
                      .put("apkInfo", info)
              }

              fun listFiles(path: String, prefix: String, offset: Int, limit: Int): JSONObject {
                  val rows = ArrayList<String>()
                  ZipFile(path).use { z ->
                      for (e in z.entries()) if (e.name.startsWith(prefix)) rows.add(e.name + "  [" + e.size + " B, comp " + e.compressedSize + "]")
                  }
                  val arr = JSONArray()
                  for (r in rows.drop(offset).take(limit)) arr.put(r)
                  return JSONObject().put("total", rows.size).put("offset", offset).put("entries", arr)
              }

              fun readEntry(path: String, entry: String, mode: String, offset: Int, length: Int): String {
                  val len = minOf(maxOf(length, 1), 131072)
                  val bytes = ZipFile(path).use { z ->
                      val e = z.getEntry(entry) ?: throw IllegalArgumentException("entrada nao encontrada: $entry")
                      z.getInputStream(e).use { readRange(it, offset.toLong(), len) }
                  }
                  return "[" + entry + " offset=" + offset + " lidos=" + bytes.size + " magic=" + Fmt.magic(bytes) + "]\n" +
                      Fmt.render(bytes, mode, offset.toLong(), 6)
              }

              // ---------- binary XML ----------

              fun decodeXml(ctx: Context, t: Target, entry: String): String {
                  val pm = ctx.packageManager
                  val res: Resources = if (t.pkg != null) {
                      pm.getResourcesForApplication(t.pkg)
                  } else {
                      val pi = pm.getPackageArchiveInfo(t.path, 0) ?: throw IllegalArgumentException("nao e um APK valido")
                      val ai = pi.applicationInfo!!
                      ai.sourceDir = t.path
                      ai.publicSourceDir = t.path
                      pm.getResourcesForApplication(ai)
                  }
                  val p = res.assets.openXmlResourceParser(entry)
                  val sb = StringBuilder()
                  try {
                      var ev = p.eventType
                      while (ev != XmlPullParser.END_DOCUMENT) {
                          when (ev) {
                              XmlPullParser.START_TAG -> {
                                  sb.append(" ".repeat((p.depth - 1) * 2)).append('<').append(p.name)
                                  for (i in 0 until p.attributeCount) {
                                      var n: String? = p.getAttributeName(i)
                                      if (n.isNullOrEmpty()) n = "res_0x" + Integer.toHexString(p.getAttributeNameResource(i))
                                      val ns = p.getAttributeNamespace(i)
                                      val prefix = if (ns == ANDROID_NS) "android:" else if (!ns.isNullOrEmpty()) "app:" else ""
                                      sb.append(' ').append(prefix).append(n).append("=\"").append(p.getAttributeValue(i)).append('"')
                                  }
                                  sb.append(">\n")
                              }
                              XmlPullParser.END_TAG -> sb.append(" ".repeat((p.depth - 1) * 2)).append("</").append(p.name).append(">\n")
                              XmlPullParser.TEXT -> if (p.text.isNotBlank()) sb.append(" ".repeat(p.depth * 2)).append(p.text.trim()).append('\n')
                          }
                          ev = p.next()
                      }
                  } finally {
                      p.close()
                  }
                  return sb.toString()
              }

              // ---------- dex ----------

              private fun dexStrings(b: ByteArray): List<String> {
                  val bb = ByteBuffer.wrap(b).order(ByteOrder.LITTLE_ENDIAN)
                  val n = bb.getInt(0x38)
                  val off = bb.getInt(0x3C)
                  val out = ArrayList<String>(n)
                  for (i in 0 until n) {
                      var p = bb.getInt(off + i * 4)
                      while ((b[p].toInt() and 0x80) != 0) p++
                      p++
                      val start = p
                      while (p < b.size && b[p].toInt() != 0) p++
                      out.add(String(b, start, p - start, Charsets.UTF_8))
                  }
                  return out
              }

              fun dexClasses(path: String, dexSel: String, filter: String, offset: Int, limit: Int): JSONObject {
                  val rows = ArrayList<String>()
                  for (d in namesFor(path, dexSel)) {
                      for (c in load(path, d).dex.classes) {
                          val t = c.type
                          if (filter.isEmpty() || t.contains(filter, ignoreCase = true)) rows.add("$t  ($d)")
                      }
                  }
                  rows.sort()
                  val arr = JSONArray()
                  for (r in rows.drop(offset).take(limit)) arr.put(r)
                  return JSONObject().put("total", rows.size).put("offset", offset).put("classes", arr)
              }

              fun classSummary(path: String, cls: String): JSONObject {
                  val (dexName, c) = findClass(path, cls)
                  val fields = JSONArray()
                  for (f in c.fields) fields.put(flags(f.accessFlags) + " " + f.name + ":" + f.type)
                  val methods = JSONArray()
                  for (m in c.methods) methods.put(flags(m.accessFlags) + " " + m.name + "(" + m.parameterTypes.joinToString("") + ")" + m.returnType)
                  return JSONObject()
                      .put("dex", dexName)
                      .put("class", c.type)
                      .put("flags", flags(c.accessFlags))
                      .put("super", c.superclass ?: JSONObject.NULL)
                      .put("interfaces", JSONArray(c.interfaces.toList()))
                      .put("sourceFile", c.sourceFile ?: JSONObject.NULL)
                      .put("fields", fields)
                      .put("methods", methods)
              }

              fun classSmali(path: String, cls: String, max: Int): String {
                  val (dexName, c) = findClass(path, cls)
                  val sw = StringWriter()
                  ClassDefinition(BaksmaliOptions(), c).writeTo(IndentingWriter(sw))
                  var s = sw.toString()
                  val total = s.length
                  if (s.length > max) s = s.take(max) + "\n# ...[truncado: $total chars no total]"
                  return "# dex: $dexName\n$s"
              }

              fun findMethods(path: String, query: String, limit: Int): JSONObject {
                  val out = JSONArray()
                  var total = 0
                  for (d in dexNames(path)) {
                      for (c in load(path, d).dex.classes) {
                          for (m in c.methods) {
                              if (m.name.contains(query, true) || c.type.contains(query, true)) {
                                  total++
                                  if (out.length() < limit) out.put(sig(c, m) + "  ($d)")
                              }
                          }
                      }
                  }
                  return JSONObject().put("matches", total).put("shown", out.length()).put("methods", out)
              }

              fun searchStrings(path: String, query: String, limit: Int): JSONObject {
                  val out = JSONArray()
                  var total = 0
                  for (d in dexNames(path)) {
                      for (s in dexStrings(load(path, d).bytes)) {
                          if (s.contains(query, ignoreCase = true)) {
                              total++
                              if (out.length() < limit) out.put(JSONObject().put("dex", d).put("string", s.take(300)))
                          }
                      }
                  }
                  return JSONObject().put("matches", total).put("shown", out.length()).put("results", out)
              }

              fun findRefs(path: String, needle: String, limit: Int, dexSel: String): JSONObject {
                  val deadline = System.nanoTime() + 25_000_000_000L
                  val out = JSONArray()
                  var total = 0
                  var partial = false
                  outer@ for (d in namesFor(path, dexSel)) {
                      for (c in load(path, d).dex.classes) {
                          for (m in c.methods) {
                              val impl = m.implementation ?: continue
                              for (insn in impl.instructions) {
                                  if (insn is ReferenceInstruction) {
                                      val r: String = try {
                                          ReferenceUtil.getReferenceString(insn.reference) ?: ""
                                      } catch (e: Exception) {
                                          ""
                                      }
                                      if (r.isNotEmpty() && r.contains(needle, ignoreCase = true)) {
                                          total++
                                          if (out.length() < limit) {
                                              out.put(sig(c, m) + "  <-  " + insn.opcode + " " + r.take(200))
                                          }
                                      }
                                  }
                              }
                              if (System.nanoTime() > deadline) {
                                  partial = true
                                  break@outer
                              }
                          }
                      }
                  }
                  return JSONObject().put("matches", total).put("shown", out.length()).put("partial", partial).put("references", out)
              }
          }
          __REA_EOF__
          mkdir -p app/src/main/java/app/rea/android
          cat > app/src/main/java/app/rea/android/AppState.kt <<'__REA_EOF__'
          package app.rea.android

          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          object AppState {
              @Volatile var running = false
              @Volatile var publicBase: String? = null
              @Volatile var token = ""
              @Volatile var listener: (() -> Unit)? = null

              private val logs = ArrayDeque<String>()
              private val fmt = SimpleDateFormat("HH:mm:ss", Locale.US)

              @Synchronized
              fun log(msg: String) {
                  logs.addLast(fmt.format(Date()) + "  " + msg)
                  while (logs.size > 250) logs.removeFirst()
                  listener?.invoke()
              }

              @Synchronized
              fun logText(): String = logs.joinToString("\n")

              fun changed() {
                  listener?.invoke()
              }

              fun connectorUrl(): String? {
                  val b = publicBase ?: return null
                  return b.trimEnd('/') + "/mcp/" + token
              }
          }
          __REA_EOF__
          mkdir -p app/src/main/java/app/rea/android
          cat > app/src/main/java/app/rea/android/Core.kt <<'__REA_EOF__'
          package app.rea.android

          import android.content.Context
          import android.content.pm.ApplicationInfo
          import android.content.pm.ComponentInfo
          import android.content.pm.PackageInfo
          import android.content.pm.PackageManager
          import android.content.pm.Signature
          import android.database.sqlite.SQLiteDatabase
          import android.os.Build
          import android.os.Environment
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.ByteArrayInputStream
          import java.io.File
          import java.io.InputStream
          import java.security.MessageDigest
          import java.security.cert.CertificateFactory
          import java.security.cert.X509Certificate

          class Target(val path: String, val pkg: String?)

          fun sha256(b: ByteArray): String =
              MessageDigest.getInstance("SHA-256").digest(b).joinToString("") { "%02x".format(it.toInt() and 0xff) }

          fun sha256File(f: File): String {
              val md = MessageDigest.getInstance("SHA-256")
              f.inputStream().use { ins ->
                  val buf = ByteArray(65536)
                  while (true) {
                      val n = ins.read(buf)
                      if (n < 0) break
                      md.update(buf, 0, n)
                  }
              }
              return md.digest().joinToString("") { "%02x".format(it.toInt() and 0xff) }
          }

          fun readRange(ins: InputStream, off: Long, len: Int): ByteArray {
              var skipped = 0L
              while (skipped < off) {
                  val s = ins.skip(off - skipped)
                  if (s <= 0) {
                      if (ins.read() < 0) break
                      skipped++
                  } else {
                      skipped += s
                  }
              }
              val buf = ByteArray(len)
              var n = 0
              while (n < len) {
                  val r = ins.read(buf, n, len - n)
                  if (r < 0) break
                  n += r
              }
              return buf.copyOf(n)
          }

          object Fmt {
              fun render(b: ByteArray, mode: String, base: Long, minLen: Int): String = when (mode) {
                  "hex" -> hex(b, base)
                  "strings" -> strings(b, minLen)
                  else -> {
                      val s = String(b, Charsets.UTF_8)
                      val bad = s.count { it == '\uFFFD' || (it < ' ' && it != '\n' && it != '\r' && it != '\t') }
                      val warn = if (s.isNotEmpty() && bad > s.length / 10) "[aviso: parece binario; use mode=hex ou strings]\n" else ""
                      warn + s
                  }
              }

              fun hex(b: ByteArray, base: Long): String {
                  val sb = StringBuilder()
                  var i = 0
                  while (i < b.size) {
                      sb.append("%08x  ".format(base + i))
                      val end = minOf(i + 16, b.size)
                      for (j in i until i + 16) {
                          if (j < end) sb.append("%02x ".format(b[j].toInt() and 0xff)) else sb.append("   ")
                      }
                      sb.append(" |")
                      for (j in i until end) {
                          val c = b[j].toInt() and 0xff
                          sb.append(if (c in 32..126) c.toChar() else '.')
                      }
                      sb.append("|\n")
                      i += 16
                  }
                  return sb.toString()
              }

              fun strings(b: ByteArray, minLen: Int): String {
                  val sb = StringBuilder()
                  var start = -1
                  var lines = 0
                  for (i in 0..b.size) {
                      val c = if (i < b.size) (b[i].toInt() and 0xff) else 0
                      val printable = c in 32..126 || c == 9
                      if (printable) {
                          if (start < 0) start = i
                      } else {
                          if (start >= 0 && i - start >= minLen) {
                              sb.append(start).append(": ").append(String(b, start, i - start, Charsets.ISO_8859_1)).append('\n')
                              lines++
                              if (lines >= 5000) return sb.append("...[limite de linhas]").toString()
                          }
                          start = -1
                      }
                  }
                  return sb.toString()
              }

              fun magic(b: ByteArray): String {
                  fun st(vararg x: Int): Boolean = b.size >= x.size && x.indices.all { (b[it].toInt() and 0xff) == x[it] }
                  return when {
                      st(0x7f, 0x45, 0x4c, 0x46) -> "ELF"
                      st(0x50, 0x4b, 3, 4) -> "ZIP/APK/JAR"
                      st(0x64, 0x65, 0x78, 0x0a) -> "DEX"
                      st(0x53, 0x51, 0x4c, 0x69) -> "SQLite3"
                      st(0x00, 0x61, 0x73, 0x6d) -> "WebAssembly"
                      st(0x89, 0x50, 0x4e, 0x47) -> "PNG"
                      st(0x25, 0x50, 0x44, 0x46) -> "PDF"
                      st(0x03, 0x00, 0x08, 0x00) -> "Android binary XML"
                      st(0x1f, 0x8b) -> "gzip"
                      st(0x4d, 0x5a) -> "PE/DOS (MZ)"
                      st(0xfe, 0xed, 0xfa, 0xce) || st(0xcf, 0xfa, 0xed, 0xfe) -> "Mach-O"
                      else -> "desconhecido"
                  }
              }
          }

          object Core {
              fun resolve(ctx: Context, t: String): Target {
                  require(t.isNotBlank()) { "target vazio" }
                  if (t.startsWith("/")) {
                      val f = File(t)
                      require(f.exists()) { "arquivo nao existe: $t" }
                      require(f.canRead()) { "sem permissao para ler $t (conceda 'acesso a todos os arquivos' ao app)" }
                      return Target(t, null)
                  }
                  try {
                      val ai = ctx.packageManager.getApplicationInfo(t, 0)
                      return Target(ai.sourceDir, t)
                  } catch (e: PackageManager.NameNotFoundException) {
                      throw IllegalArgumentException("pacote nao instalado: $t")
                  }
              }

              fun deviceInfo(ctx: Context): JSONObject {
                  val allFiles = if (Build.VERSION.SDK_INT >= 30) Environment.isExternalStorageManager() else true
                  return JSONObject()
                      .put("manufacturer", Build.MANUFACTURER)
                      .put("model", Build.MODEL)
                      .put("android", Build.VERSION.RELEASE)
                      .put("sdk", Build.VERSION.SDK_INT)
                      .put("abis", JSONArray(Build.SUPPORTED_ABIS.toList()))
                      .put("allFilesAccess", allFiles)
                      .put("externalStorage", Environment.getExternalStorageDirectory().absolutePath)
                      .put("appFilesDir", ctx.filesDir.absolutePath)
              }

              @Suppress("DEPRECATION")
              fun listApps(ctx: Context, a: JSONObject): JSONObject {
                  val pm = ctx.packageManager
                  val f = a.s("filter").lowercase()
                  val sys = a.b("include_system", false)
                  val limit = a.i("limit", 100)
                  val rows = ArrayList<JSONObject>()
                  for (ai in pm.getInstalledApplications(0)) {
                      val isSys = (ai.flags and ApplicationInfo.FLAG_SYSTEM) != 0
                      if (isSys && !sys) continue
                      val label = pm.getApplicationLabel(ai).toString()
                      if (f.isNotEmpty() && !label.lowercase().contains(f) && !ai.packageName.lowercase().contains(f)) continue
                      rows.add(
                          JSONObject().put("package", ai.packageName).put("label", label)
                              .put("system", isSys).put("apk", ai.sourceDir)
                      )
                  }
                  rows.sortBy { it.getString("label").lowercase() }
                  val arr = JSONArray()
                  for (r in rows.take(limit)) arr.put(r)
                  return JSONObject().put("total", rows.size).put("shown", arr.length()).put("apps", arr)
              }

              @Suppress("DEPRECATION")
              fun sigsOf(pi: PackageInfo): Array<Signature> {
                  if (Build.VERSION.SDK_INT >= 28) {
                      val si = pi.signingInfo ?: return emptyArray()
                      return (if (si.hasMultipleSigners()) si.apkContentsSigners else si.signingCertificateHistory) ?: emptyArray()
                  }
                  return pi.signatures ?: emptyArray()
              }

              fun certs(pi: PackageInfo): JSONArray {
                  val out = JSONArray()
                  for (sig in sigsOf(pi)) {
                      val bytes = sig.toByteArray()
                      val o = JSONObject().put("sha256", sha256(bytes))
                      try {
                          val c = CertificateFactory.getInstance("X.509").generateCertificate(ByteArrayInputStream(bytes)) as X509Certificate
                          o.put("subject", c.subjectX500Principal.name)
                          o.put("issuer", c.issuerX500Principal.name)
                          o.put("notBefore", c.notBefore.toString())
                          o.put("notAfter", c.notAfter.toString())
                      } catch (e: Exception) {
                          o.put("parseError", e.message ?: "")
                      }
                      out.put(o)
                  }
                  return out
              }

              private fun comp(ci: ComponentInfo, perm: String?): JSONObject =
                  JSONObject().put("name", ci.name).put("exported", ci.exported).put("enabled", ci.enabled)
                      .put("permission", perm ?: JSONObject.NULL)

              @Suppress("DEPRECATION")
              fun appInfo(ctx: Context, pkg: String): JSONObject {
                  val pm = ctx.packageManager
                  val flags = PackageManager.GET_ACTIVITIES or PackageManager.GET_SERVICES or PackageManager.GET_RECEIVERS or
                      PackageManager.GET_PROVIDERS or PackageManager.GET_PERMISSIONS or PackageManager.GET_META_DATA or
                      (if (Build.VERSION.SDK_INT >= 28) PackageManager.GET_SIGNING_CERTIFICATES else PackageManager.GET_SIGNATURES)
                  val pi = try {
                      pm.getPackageInfo(pkg, flags)
                  } catch (e: PackageManager.NameNotFoundException) {
                      throw IllegalArgumentException("pacote nao instalado: $pkg")
                  }
                  val ai = pi.applicationInfo!!
                  val o = JSONObject()
                  o.put("package", pi.packageName)
                  o.put("label", pm.getApplicationLabel(ai).toString())
                  o.put("versionName", pi.versionName ?: JSONObject.NULL)
                  o.put("versionCode", if (Build.VERSION.SDK_INT >= 28) pi.longVersionCode else pi.versionCode.toLong())
                  o.put("minSdk", ai.minSdkVersion)
                  o.put("targetSdk", ai.targetSdkVersion)
                  o.put("firstInstall", pi.firstInstallTime)
                  o.put("lastUpdate", pi.lastUpdateTime)
                  val installer = if (Build.VERSION.SDK_INT >= 30) {
                      try { pm.getInstallSourceInfo(pkg).installingPackageName } catch (e: Exception) { null }
                  } else {
                      pm.getInstallerPackageName(pkg)
                  }
                  o.put("installer", installer ?: JSONObject.NULL)
                  o.put("debuggable", (ai.flags and ApplicationInfo.FLAG_DEBUGGABLE) != 0)
                  o.put("system", (ai.flags and ApplicationInfo.FLAG_SYSTEM) != 0)
                  o.put("allowBackup", (ai.flags and ApplicationInfo.FLAG_ALLOW_BACKUP) != 0)
                  o.put("sourceDir", ai.sourceDir)
                  o.put("splitSourceDirs", JSONArray((ai.splitSourceDirs ?: emptyArray()).toList()))
                  o.put("nativeLibraryDir", ai.nativeLibraryDir)
                  o.put("dataDir", ai.dataDir)
                  val perms = JSONArray()
                  val rp = pi.requestedPermissions
                  val rf = pi.requestedPermissionsFlags
                  if (rp != null) {
                      for (i in rp.indices) {
                          val granted = rf != null && (rf[i] and PackageInfo.REQUESTED_PERMISSION_GRANTED) != 0
                          perms.put(JSONObject().put("name", rp[i]).put("granted", granted))
                      }
                  }
                  o.put("permissions", perms)
                  val acts = JSONArray(); pi.activities?.forEach { acts.put(comp(it, it.permission)) }
                  val srvs = JSONArray(); pi.services?.forEach { srvs.put(comp(it, it.permission)) }
                  val recs = JSONArray(); pi.receivers?.forEach { recs.put(comp(it, it.permission)) }
                  val provs = JSONArray()
                  pi.providers?.forEach {
                      provs.put(
                          JSONObject().put("name", it.name).put("authority", it.authority ?: JSONObject.NULL)
                              .put("exported", it.exported).put("grantUriPermissions", it.grantUriPermissions)
                              .put("readPermission", it.readPermission ?: JSONObject.NULL)
                              .put("writePermission", it.writePermission ?: JSONObject.NULL)
                      )
                  }
                  o.put("activities", acts).put("services", srvs).put("receivers", recs).put("providers", provs)
                  val meta = JSONArray()
                  ai.metaData?.keySet()?.forEach { meta.put(it) }
                  o.put("metaDataKeys", meta)
                  o.put("certificates", certs(pi))
                  return o
              }

              fun extractApk(ctx: Context, pkg: String): JSONObject {
                  val ai = try {
                      ctx.packageManager.getApplicationInfo(pkg, 0)
                  } catch (e: PackageManager.NameNotFoundException) {
                      throw IllegalArgumentException("pacote nao instalado: $pkg")
                  }
                  val dir = File(ctx.getExternalFilesDir(null), "apks")
                  dir.mkdirs()
                  val srcs = arrayListOf(ai.sourceDir)
                  ai.splitSourceDirs?.let { srcs.addAll(it) }
                  val out = JSONArray()
                  for (s in srcs) {
                      val src = File(s)
                      val dst = File(dir, pkg + "-" + src.name)
                      src.copyTo(dst, overwrite = true)
                      out.put(JSONObject().put("path", dst.absolutePath).put("size", dst.length()).put("sha256", sha256File(dst)))
                  }
                  return JSONObject().put("files", out)
              }

              fun inspectFile(a: JSONObject): Any {
                  val f = File(a.s("path"))
                  require(f.exists()) { "arquivo nao existe" }
                  require(f.isFile) { "nao e um arquivo" }
                  require(f.canRead()) { "sem permissao de leitura (conceda acesso a todos os arquivos)" }
                  val mode = a.s("mode", "info")
                  val off = a.i("offset", 0).toLong()
                  val len = minOf(a.i("length", 4096), 131072)
                  if (mode == "info") {
                      val head = f.inputStream().use { readRange(it, 0, 16) }
                      val o = JSONObject().put("path", f.absolutePath).put("size", f.length())
                          .put("modified", f.lastModified()).put("magic", Fmt.magic(head))
                      if (f.length() < 600L * 1024 * 1024) o.put("sha256", sha256File(f))
                      return o
                  }
                  val bytes = f.inputStream().use { readRange(it, off, len) }
                  return Fmt.render(bytes, mode, off, a.i("min_len", 6))
              }

              fun listDir(path: String, limit: Int): JSONObject {
                  val d = File(path)
                  require(d.isDirectory) { "nao e um diretorio: $path" }
                  val list = d.listFiles() ?: throw IllegalArgumentException("sem permissao para listar $path")
                  val arr = JSONArray()
                  for (f in list.sortedBy { it.name.lowercase() }.take(limit)) {
                      arr.put(
                          JSONObject().put("name", f.name).put("dir", f.isDirectory)
                              .put("size", if (f.isFile) f.length() else JSONObject.NULL).put("modified", f.lastModified())
                      )
                  }
                  return JSONObject().put("path", path).put("total", list.size).put("entries", arr)
              }

              fun sqlite(a: JSONObject): JSONObject {
                  val path = a.s("path")
                  require(File(path).canRead()) { "sem permissao de leitura" }
                  val table = a.s("table")
                  val limit = a.i("limit", 20)
                  val db = SQLiteDatabase.openDatabase(path, null, SQLiteDatabase.OPEN_READONLY)
                  try {
                      if (table.isEmpty()) {
                          val arr = JSONArray()
                          db.rawQuery("SELECT type,name,sql FROM sqlite_master ORDER BY type,name", null).use { c ->
                              while (c.moveToNext()) {
                                  arr.put(JSONObject().put("type", c.getString(0)).put("name", c.getString(1)).put("sql", c.getString(2) ?: JSONObject.NULL))
                              }
                          }
                          return JSONObject().put("schema", arr)
                      }
                      var exists = false
                      db.rawQuery("SELECT 1 FROM sqlite_master WHERE name=?", arrayOf(table)).use { c -> exists = c.moveToFirst() }
                      require(exists) { "tabela nao encontrada: $table" }
                      val rows = JSONArray()
                      var cols = JSONArray()
                      db.rawQuery("SELECT * FROM \"" + table.replace("\"", "\"\"") + "\" LIMIT " + limit, null).use { c ->
                          cols = JSONArray(c.columnNames.toList())
                          while (c.moveToNext()) {
                              val r = JSONArray()
                              for (i in 0 until c.columnCount) {
                                  when (c.getType(i)) {
                                      0 -> r.put(JSONObject.NULL)
                                      1 -> r.put(c.getLong(i))
                                      2 -> r.put(c.getDouble(i))
                                      3 -> r.put(c.getString(i).take(500))
                                      else -> r.put("<blob " + c.getBlob(i).size + " bytes>")
                                  }
                              }
                              rows.put(r)
                          }
                      }
                      return JSONObject().put("table", table).put("columns", cols).put("rows", rows)
                  } finally {
                      db.close()
                  }
              }

              fun writeFile(path: String, content: String, append: Boolean): JSONObject {
                  val f = File(path)
                  f.parentFile?.mkdirs()
                  if (append) f.appendText(content) else f.writeText(content)
                  return JSONObject().put("path", f.absolutePath).put("bytes", f.length())
              }
          }
