          package app.rea.android

          import fi.iki.elonen.NanoHTTPD
          import fi.iki.elonen.NanoHTTPD.IHTTPSession
          import fi.iki.elonen.NanoHTTPD.Method
          import fi.iki.elonen.NanoHTTPD.Response
          import org.json.JSONArray
          import org.json.JSONObject

          class RpcError(val code: Int, msg: String) : Exception(msg)

          const val INSTRUCTIONS = "REA Android: reverse-engineering toolkit running ON the user's Android phone. " +
              "Typical workflow: list_apps -> app_info -> apk_overview -> apk_decode_xml (AndroidManifest.xml) -> " +
              "dex_classes / dex_find_methods / dex_search_strings / dex_find_references -> dex_class_summary / dex_class_smali -> " +
              "elf_inspect for native libs. Web: fetch_url / analyze_website. Files: list_dir / inspect_file / sqlite_inspect. " +
              "Outputs are bounded: use filters, offset and limit. Decompilation output is smali (Dalvik assembly), not Java. " +
              "Only analyze software the user owns or is authorized to examine."

          class McpHttpServer(
              port: Int,
              private val token: String,
              private val registry: ToolRegistry
          ) : NanoHTTPD("127.0.0.1", port) {

              private val versions = listOf("2025-06-18", "2025-03-26", "2024-11-05")

              override fun serve(session: IHTTPSession): Response {
                  val uri = session.uri ?: "/"
                  if (uri == "/health") return plain(Response.Status.OK, "ok")
                  val auth = session.headers["authorization"] ?: ""
                  val authorized = uri == "/mcp/$token" || (uri == "/mcp" && auth == "Bearer $token")
                  if (!authorized) return plain(Response.Status.NOT_FOUND, "not found")
                  return when (session.method) {
                      Method.POST -> post(session)
                      Method.DELETE -> plain(Response.Status.OK, "")
                      Method.OPTIONS -> plain(Response.Status.NO_CONTENT, "")
                      else -> plain(Response.Status.METHOD_NOT_ALLOWED, "use POST")
                  }
              }

              private fun plain(st: Response.Status, s: String): Response =
                  NanoHTTPD.newFixedLengthResponse(st, "text/plain", s)

              private fun json(s: String): Response =
                  NanoHTTPD.newFixedLengthResponse(Response.Status.OK, "application/json", s)

              private fun post(session: IHTTPSession): Response {
                  val files = HashMap<String, String>()
                  try {
                      session.parseBody(files)
                  } catch (e: Exception) {
                      return plain(Response.Status.BAD_REQUEST, "bad body")
                  }
                  val body = (files["postData"] ?: "").trim()
                  if (body.isEmpty()) return plain(Response.Status.BAD_REQUEST, "empty body")
                  return try {
                      if (body.startsWith("[")) {
                          val arr = JSONArray(body)
                          val out = JSONArray()
                          for (i in 0 until arr.length()) {
                              val r = handle(arr.getJSONObject(i))
                              if (r != null) out.put(r)
                          }
                          if (out.length() == 0) plain(Response.Status.ACCEPTED, "") else json(out.toString())
                      } else {
                          val r = handle(JSONObject(body))
                          if (r == null) plain(Response.Status.ACCEPTED, "") else json(r.toString())
                      }
                  } catch (e: Exception) {
                      json(errorObj(null, -32700, "parse error: " + e.message).toString())
                  }
              }

              private fun errorObj(id: Any?, code: Int, msg: String): JSONObject =
                  JSONObject().put("jsonrpc", "2.0").put("id", id ?: JSONObject.NULL)
                      .put("error", JSONObject().put("code", code).put("message", msg))

              private fun handle(m: JSONObject): JSONObject? {
                  if (!m.has("method")) return null
                  val method = m.getString("method")
                  if (!m.has("id")) return null
                  val id = m.get("id")
                  return try {
                      val params = m.optJSONObject("params") ?: JSONObject()
                      val result: Any = when (method) {
                          "initialize" -> initialize(params)
                          "ping" -> JSONObject()
                          "tools/list" -> {
                              val arr = JSONArray()
                              for (t in registry.tools) {
                                  arr.put(
                                      JSONObject().put("name", t.name).put("description", t.desc)
                                          .put("inputSchema", t.schema())
                                  )
                              }
                              JSONObject().put("tools", arr)
                          }
                          "tools/call" -> call(params)
                          "resources/list" -> JSONObject().put("resources", JSONArray())
                          "prompts/list" -> JSONObject().put("prompts", JSONArray())
                          else -> throw RpcError(-32601, "Method not found: $method")
                      }
                      JSONObject().put("jsonrpc", "2.0").put("id", id).put("result", result)
                  } catch (e: RpcError) {
                      errorObj(id, e.code, e.message ?: "error")
                  } catch (e: Exception) {
                      errorObj(id, -32603, e.message ?: "internal error")
                  }
              }

              private fun initialize(p: JSONObject): JSONObject {
                  val req = p.optString("protocolVersion")
                  val v = if (req in versions) req else versions[0]
                  AppState.log("cliente MCP conectou (protocolo $v)")
                  return JSONObject()
                      .put("protocolVersion", v)
                      .put("capabilities", JSONObject().put("tools", JSONObject().put("listChanged", false)))
                      .put("serverInfo", JSONObject().put("name", "rea-android").put("version", "0.1.0"))
                      .put("instructions", INSTRUCTIONS)
              }

              private fun call(p: JSONObject): JSONObject {
                  val name = p.optString("name")
                  val tool = registry.find(name) ?: throw RpcError(-32602, "Unknown tool: $name")
                  val args = p.optJSONObject("arguments") ?: JSONObject()
                  var isErr = false
                  AppState.log("tool: $name")
                  var text = try {
                      when (val r = tool.fn(args)) {
                          is JSONObject -> r.toString(2)
                          is JSONArray -> r.toString(2)
                          null -> "ok"
                          else -> r.toString()
                      }
                  } catch (e: Throwable) {
                      isErr = true
                      "Erro: " + e.javaClass.simpleName + ": " + (e.message ?: "")
                  }
                  if (text.length > 120000) text = text.take(120000) + "\n...[saida truncada; use filtros/offset/limit]"
                  return JSONObject()
                      .put("content", JSONArray().put(JSONObject().put("type", "text").put("text", text)))
                      .put("isError", isErr)
              }
          }
