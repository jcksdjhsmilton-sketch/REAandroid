      - name: Incluir keystore de debug no app (assinar APKs editados no celular)
        run: |
          set -e
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10950 -dname "CN=Android Debug,O=Android,C=US"
          fi
          mkdir -p rea-android/app/src/main/res/raw
          cp "$HOME/.android/debug.keystore" rea-android/app/src/main/res/raw/rea_debug.keystore

      - name: Compilar cloudflared para Android arm64 (tunel embutido)
        run: |
          set -x
          TAG=$(curl -fsSL -H "Authorization: Bearer ${{ github.token }}" https://api.github.com/repos/cloudflare/cloudflared/releases/latest | jq -r .tag_name)
          OUT="$GITHUB_WORKSPACE/rea-android/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$OUT"
          git clone --depth 1 --branch "$TAG" https://github.com/cloudflare/cloudflared.git /tmp/cf
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          CC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"
          ok=0
          if [ -x "$CC" ]; then
            (cd /tmp/cf && GOOS=android GOARCH=arm64 CGO_ENABLED=1 CC="$CC" go build -trimpath -ldflags "-s -w" -o "$OUT/libcloudflared.so" ./cmd/cloudflared) && ok=1
          fi
          if [ "$ok" != 1 ]; then
            echo "::warning::build GOOS=android falhou; usando binario linux-arm64 oficial (DNS pode falhar no Android)"
            curl -fL "https://github.com/cloudflare/cloudflared/releases/download/$TAG/cloudflared-linux-arm64" -o "$OUT/libcloudflared.so"
          fi
          ls -la "$OUT"

      - name: Compilar APK
        working-directory: rea-android
        run: |
          set +e
          gradle --no-daemon --console=plain assembleDebug > build.log 2>&1
          code=$?
          echo "gradle terminou com codigo $code"
          if [ $code -ne 0 ]; then
            echo "=============== RESUMO DOS ERROS ==============="
            grep -E "^e: |What went wrong|Execution failed|Could not|requires|incompatible|Caused by|error:" -A4 build.log | head -n 70
            echo "------ ultimas linhas ------"
            tail -n 25 build.log
            echo "================================================"
          fi
          exit $code

      - name: Guardar APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: REA-Android
          path: rea-android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar APK em Releases (tag latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp rea-android/app/build/outputs/apk/debug/app-debug.apk REA-Android.apk
          gh release delete latest --repo "${{ github.repository }}" --cleanup-tag -y || true
          gh release create latest REA-Android.apk --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "REA Android (latest)" --notes "APK gerado pelo GitHub Actions."
