                          val v = if (is64) bb.getLong(p + 8) else (bb.getInt(p + 4).toLong() and 0xffffffffL)
                          if (tag == 0L) break
                          if (tag == 1L) needed.put(cstr((str.off + v).toInt()))
                          if (tag == 14L) soname = cstr((str.off + v).toInt())
                          p += ent
                      }
                      out.put("needed", needed)
                      if (soname.isNotEmpty()) out.put("soname", soname)
                  }

                  val ds = secs.firstOrNull { it.type == 11 }
                  if (ds != null && ds.link < secs.size) {
                      val str = secs[ds.link]
                      val esz = if (ds.entsize > 0) ds.entsize.toInt() else if (is64) 24 else 16
                      val count = (ds.size / esz).toInt()
                      val imports = JSONArray()
                      val exports = JSONArray()
                      val jni = JSONArray()
                      var hasOnLoad = false
                      var nImp = 0
                      var nExp = 0
                      for (i in 0 until count) {
                          val o = (ds.off + i.toLong() * esz).toInt()
                          if (o + esz > b.size) break
                          val nameOff: Int
                          val shndx: Int
                          if (is64) {
                              nameOff = bb.getInt(o)
                              shndx = bb.getShort(o + 6).toInt() and 0xffff
                          } else {
                              nameOff = bb.getInt(o)
                              shndx = bb.getShort(o + 14).toInt() and 0xffff
                          }
                          val name = cstr((str.off + nameOff).toInt())
                          if (name.isEmpty()) continue
                          if (shndx == 0) {
                              nImp++
                              if (imports.length() < maxSyms) imports.put(name)
                          } else {
                              nExp++
                              if (exports.length() < maxSyms) exports.put(name)
                              if (name == "JNI_OnLoad") hasOnLoad = true
                              if (name.startsWith("Java_")) jni.put(name)
                          }
                      }
                      out.put("hasJNI_OnLoad", hasOnLoad)
                      out.put("jniExports", jni)
                      out.put("importsTotal", nImp)
                      out.put("exportsTotal", nExp)
                      out.put("imports", imports)
                      out.put("exports", exports)
                  }
                  return out
              }
          }
